name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发一次部署
  workflow_dispatch:

# GITHUB_TOKEN 的最小权限：读仓库 + 写 Pages + 取 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一条部署；不打断已在进行的部署（避免线上出现半截产物）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 要求 Node >= 22.12
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 这一步内含字形检查（package.json 的 build 脚本是
      # `astro build && node scripts/check-glyphs.mjs`）。
      # 字形缺失会让构建失败 —— 这是有意的质量闸门：
      # 线上出现「豆腐块」比一次红色构建难查得多。
      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
